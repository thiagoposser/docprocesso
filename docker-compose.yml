name: ${PROJECT_NAME}

services:
  postgres:
    image: postgres:18.0-alpine
    env_file: .env
    volumes:
      # PostgreSQL 18 stores versioned clusters below this parent directory.
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    expose: ["${POSTGRES_PORT}"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8.2.1-alpine
    env_file: .env
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--port", "${REDIS_PORT}"]
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    expose: ["${REDIS_PORT}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p $${REDIS_PORT} ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      target: development
    env_file: .env
    volumes:
      - ./backend:/app
      - backend_media:${MEDIA_ROOT}
    ports: ["${DJANGO_PORT}:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/api/health/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      target: development
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports: ["${ANGULAR_PORT}:4200"]
    depends_on:
      backend: { condition: service_healthy }
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:9.8
    env_file: .env
    entrypoint: ["/template-entrypoint.sh"]
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.template.json:ro
      - ./docker/pgadmin/entrypoint.sh:/template-entrypoint.sh:ro
    ports: ["${PGADMIN_PORT}:80"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  nginx:
    image: nginx:1.29.1-alpine
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports: ["${NGINX_PORT}:80"]
    depends_on:
      backend: { condition: service_healthy }
      frontend: { condition: service_started }
    restart: unless-stopped

volumes:
  backend_media:
  postgres_data:
  redis_data:
  pgadmin_data:
  frontend_node_modules:
