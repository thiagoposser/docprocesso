events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    upstream django { server backend:8000; }
    upstream angular { server frontend:80; }
    server {
        listen 80;
        server_name _;
        client_max_body_size 20m;
        location /api/ { proxy_pass http://django; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
        location /admin/ { proxy_pass http://django; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
        location /static/ { alias /static/; expires 30d; }
        location /media/ { alias /media/; expires 7d; add_header X-Content-Type-Options nosniff; }
        location / { proxy_pass http://angular; proxy_set_header Host $host; }
    }
}
