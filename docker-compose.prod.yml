# Apply over the base file: docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
services:
  backend:
    build:
      target: production
    volumes:
      - static_data:/app/staticfiles
      - backend_media:${MEDIA_ROOT}
    ports: []

  frontend:
    build:
      target: production
    volumes: []
    ports: []

  postgres:
    ports: []

  redis:
    ports: []

  pgadmin:
    profiles: [tools]

  nginx:
    volumes:
      - ./docker/nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - static_data:/static:ro
      - backend_media:/media:ro
    ports: ["${NGINX_PORT}:80"]

volumes:
  backend_media:
  static_data:
